        ipv4_address: 172.28.1.15

  ## TON HTTP API V2
  tonhttpapi:
    container_name: ton-http-api-v2
    image: toncenter/ton-http-api-cpp:v2.1.7
    profiles: [ton-http-api-v2]
    ports:
      - "${UI_BIND_IP:-0.0.0.0}:8082:8081"
      - "${UI_BIND_IP:-0.0.0.0}:8182:8082"
    volumes:
      - shared-data:/usr/share/data
    environment:
      - THACPP_TONLIB_CONFIG_PATH=/usr/share/data/global.config.json
      - THACPP_TONLIB_KEYSTORE_PATH=/tmp/keystore/
      - THACPP_TONLIB_BOC_ENDPOINTS=[]
      - THACPP_TONLIB_THREADS
      - THACPP_MAIN_WORKER_THREADS
      - THACPP_FS_WORKER_THREADS=1
      - THACPP_HTTP_WORKER_THREADS=2
      - THACPP_LOG_LEVEL
      - THACPP_LOG_PATH=@stdout
      - THACPP_SYSTEM_LOG_LEVEL=error
      - THACPP_SYSTEM_LOG_PATH=/logs/userver-logs.txt
      - THACPP_JSONRPC_LOG_LEVEL=error
      - THACPP_JSONRPC_LOG_PATH=/logs/jsonrpc-logs.txt
      - THACPP_LOG_FORMAT
      - THACPP_HTTP_WORKER_USER_AGENT=empty
      - THACPP_STATIC_CONTENT_DIR=/static
      - THACPP_MAX_STACK_ENTRY_DEPTH=256
    restart: unless-stopped
    depends_on:
      genesis:
        condition: service_healthy
    healthcheck:
      test: curl -sS http://127.0.0.1:8082/api/v2/getMasterchainInfo || echo 1
      interval: 1s
      timeout: 5s
      retries: 10
    networks:
      main:
        ipv4_address: 172.28.1.105

  ## TonCenter Indexer (v3)
  event-cache:
    container_name: index-event-cache
    profiles: [indexer]
    image: redis:latest
    command: redis-server --maxclients 40000
    volumes:
      - event_cache:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      main:
        ipv4_address: 172.28.1.104

  event-classifier:
    container_name: index-event-classifier
    profiles: [indexer]
    image: toncenter/ton-indexer-classifier:v1.2.8
    depends_on:
      postgres:
        condition: service_healthy
      event-cache:
        condition: service_healthy
    command: --pool-size ${TON_CLASSIFIER_WORKERS:-2} --prefetch-size 10 --batch-size 100 --expected-total 128000
    environment:
      <<: *index-common
      TON_INDEXER_API_ROOT_PATH:
      TON_INDEXER_IS_TESTNET:
      TON_INDEXER_REDIS_DSN: redis://172.28.1.104:6379
    deploy:
      resources:
        limits:
          cpus: '${CLASSIFIER_CPU_QUOTE:-1.0}'
    networks:
      main:
        ipv4_address: 172.28.1.103

  index-api:
    container_name: index-api
    profiles: [indexer, indexer-minimal]
    image: toncenter/ton-indexer-api:v1.2.8
    depends_on:
      - index-worker
    command: -prefork -threads ${TON_INDEXER_WORKERS:-2}
    ports:
      - target: 8081
        published: 8081
        host_ip: ${UI_BIND_IP:-0.0.0.0}
    environment:
      <<: *index-common
      TON_INDEXER_TON_HTTP_API_ENDPOINT: http://172.28.1.102:8081/api/v2/
    restart: always
    networks:
      main:
        ipv4_address: 172.28.1.102

  run-migrations:
    container_name: run-migrations
    profiles: [indexer, indexer-minimal]
    image: toncenter/ton-indexer-worker:v1.2.8
    depends_on:
      postgres:
        condition: service_healthy
    ulimits:
      nofile: 1000000
    environment:
      <<: *index-common
      TON_WORKER_BINARY: ton-index-postgres-migrate
    networks:
      main:
    command: --pg postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@172.28.1.100:5432/${POSTGRES_DB}
    restart: on-failure

  index-worker:
    container_name: index-worker
    profiles: [indexer, indexer-minimal]
    image: toncenter/ton-indexer-worker:v1.2.8
    depends_on:
      postgres:
        condition: service_healthy
    ulimits:
      nofile: 1000000
    volumes:
      - ${TON_DB_VAL0_HOST_DIR:-ton-db-val0}:/tondb
      - ton_index_workdir:/ton_index_workdir
    environment:
      <<: *index-common
      TON_WORKER_BINARY: ton-index-postgres
    command: --pg postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@172.28.1.100:5432/${POSTGRES_DB} --db /tondb --working-dir /ton_index_workdir --from ${TON_WORKER_FROM:-1}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${INDEXER_CPU_QUOTE:-1.0}'
    networks:
      main:
        ipv4_address: 172.28.1.101

  postgres:
    container_name: index-postgres
    profiles: [indexer, indexer-minimal]
    image: postgres:17
    environment: *index-common
    ports:
      - "${MANAGEMENT_BIND_IP:-0.0.0.0}:${POSTGRES_PUBLISH_PORT:-5432}:5432"
    command: postgres -c max_connections=1024 -c shared_buffers=2GB -c work_mem=64MB -c max_wal_size=1GB -c tcp_keepalives_idle=60 -c tcp_keepalives_interval=60 -c tcp_keepalives_count=60
    depends_on:
      genesis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d ton_index -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    shm_size: 2G
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: local
      options:
        max-size: 4G
    networks:
      main:
        ipv4_address: 172.28.1.100

volumes:
  shared-data:
  native-load-wallets:
  session-stats-data:
  postgres_data:
  ton_index_workdir:
  event_cache:
  ton-db-val0:
  ton-db-val1:
  ton-db-val2:
  ton-db-val3:
  ton-db-val4:
  ton-db-val5:
# # uncomment if you want to mount this image in folder
# driver: local
# driver_opts:
#   o: bind
#   type: none
#   device: /home/user/ton-db-val0

networks:
  main:
    name: mylocalton-network
    ipam:
      driver: default
      config:
        - subnet: 172.28.1.0/24
