x-indexer-environment: &index-common
  POSTGRES_HOST: 172.28.1.100
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-ton_index}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-PostgreSQL1234}
  POSTGRES_PUBLISH_PORT: ${POSTGRES_PUBLISH_PORT:-5432}

services:
  genesis:
    container_name: genesis
    image: ${MLT_IMAGE:-ghcr.io/neodix42/mylocalton-docker}:${TON_BRANCH:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      pull: ${TON_BUILD_PULL:-true}
      args:
        TON_IMAGE: ${TON_IMAGE:-ghcr.io/corton-nommander/ton}
        TON_BRANCH: ${TON_BRANCH:-latest}
    restart: unless-stopped
    cpuset: ${GENESIS_CPUSET:-}
    ports:
      - "${LITESERVER_BIND_IP:-0.0.0.0}:40004:40004" # lite-server
      - "40003:40003/udp" # dht-server
      - "${MANAGEMENT_BIND_IP:-0.0.0.0}:40002:40002" # validator-console
      - "40001:40001/udp" # validator public port
      - "41001:41001/udp" # validator public QUIC port
      - "${FILE_SERVER_BIND_IP:-0.0.0.0}:8888:8888" # embedded http-file-server
    volumes:
      - shared-data:/usr/share/data
      # An empty TON_DB_VAL0_HOST_DIR preserves the portable named volume.
      # Set it to an absolute dedicated-NVMe directory on a physical host.
      - ${TON_DB_VAL0_HOST_DIR:-ton-db-val0}:/var/ton-work/db
      # Keep load-test private keys out of the validator database exposed to
      # the generator. This nested volume is intentionally wallet-only.
      - native-load-wallets:/var/ton-work/db/native-spam/wallets
    environment:
      - GENESIS=true
      - NAME=genesis
      - EXTERNAL_IP # used to generate  external.global.config.json that allows remote users to connect to lite-server via public IP
      - VALIDATION_PERIOD # 24h, default 20min
      - MASTERCHAIN_ONLY   # default false
      - VERBOSITY=${GENESIS_VERBOSITY:-3}
      - GENESIS_HEARTBEAT_SECONDS
      - EMBEDDED_FILE_HTTP_SERVER # enable file-http-server, default false
      - EMBEDDED_FILE_HTTP_SERVER_PORT # default port 8888
      - CUSTOM_PARAMETERS
      - CUSTOM_CONFIG_SMC_URL
      - VERSION_CAPABILITIES
      # Disabled by default. When explicitly enabled for a fresh v5 chain,
      # start-genesis resolves these to GlobalVersion 15 plus capability 1024.
      - NATIVE_TRANSFER_RUNS_ENABLED=${NATIVE_TRANSFER_RUNS_ENABLED:-0}
      - NATIVE_TRANSFER_RUNS_GLOBAL_VERSION=${NATIVE_TRANSFER_RUNS_GLOBAL_VERSION:-15}
      - NATIVE_TRANSFER_RUNS_CAPABILITY=${NATIVE_TRANSFER_RUNS_CAPABILITY:-1024}
      # Opt-in Phase-A native payment lanes. This is valid only on a fresh
      # chain with a fixed depth-1 or depth-2 split topology validated at genesis.
      - NATIVE_PAYMENT_LANES_ENABLED=${NATIVE_PAYMENT_LANES_ENABLED:-0}
      - NATIVE_PAYMENT_LANES_GLOBAL_VERSION=${NATIVE_PAYMENT_LANES_GLOBAL_VERSION:-16}
      - NATIVE_PAYMENT_LANES_CAPABILITY=${NATIVE_PAYMENT_LANES_CAPABILITY:-2048}
      - NATIVE_PAYMENT_LANE_DEPTH=${NATIVE_PAYMENT_LANE_DEPTH:-1}
      - NATIVE_PAYMENT_LANE_WALLET_RETRIES=${NATIVE_PAYMENT_LANE_WALLET_RETRIES:-128}
      - NATIVE_PAYMENT_LANE_WALLET_PARALLELISM=${NATIVE_PAYMENT_LANE_WALLET_PARALLELISM:-1}
      - GLOBAL_ID # read about this and other parameters here https://github.com/neodix42/mylocalton-docker/wiki/Genesis-setup-parameters
      - MAX_VALIDATORS
      - MAX_MAIN_VALIDATORS
      - MIN_VALIDATORS
      - MIN_STAKE
      - MAX_STAKE
      - MAX_FACTOR
      - MIN_TOTAL_STAKE
      - ELECTION_START_BEFORE
      - ELECTION_END_BEFORE
      - ELECTION_STAKE_FROZEN
      - ORIGINAL_VALIDATOR_SET_VALID_FOR
      - ACTUAL_MIN_SPLIT
      - MIN_SPLIT
      - MAX_SPLIT
      - CELL_PRICE
      - CELL_PRICE_MC
      - GAS_PRICE
      - GAS_PRICE_MC
      - SIMPLE_FAUCET_INITIAL_BALANCE
      - HIGHLOAD_FAUCET_INITIAL_BALANCE
      - DATA_FAUCET_INITIAL_BALANCE
      - VALIDATOR_0_INITIAL_BALANCE
      - VALIDATOR_1_INITIAL_BALANCE
      - VALIDATOR_2_INITIAL_BALANCE
      - VALIDATOR_3_INITIAL_BALANCE
      - VALIDATOR_4_INITIAL_BALANCE
      - VALIDATOR_5_INITIAL_BALANCE
      - BIT_PRICE_PER_SECOND
      - CELL_PRICE_PER_SECOND
      - BIT_PRICE_PER_SECOND_MC
      - CELL_PRICE_PER_SECOND_MC
      - CRITICAL_PARAM_MIN_WINS
      - CRITICAL_PARAM_MAX_LOSSES
      - SIMPLEX_TARGET_RATE_MS
      - SIMPLEX_SLOTS_PER_LEADER_WINDOW
      - SIMPLEX_FIRST_BLOCK_TIMEOUT_MS
      - SIMPLEX_MAX_LEADER_WINDOW_DESYNC
      # Explicit benchmark mode. Simplex target_rate remains a failure/skip
      # timeout and does not pace candidate production when this is enabled.
      - TON_SIMPLEX_MAX_TPS=${TON_SIMPLEX_MAX_TPS:-0}
      - TON_SIMPLEX_MAX_TPS_CANDIDATE_TIMEOUT_MS=${TON_SIMPLEX_MAX_TPS_CANDIDATE_TIMEOUT_MS:-5000}
      - TON_SIMPLEX_MAX_TPS_FINALIZE_RESERVE_MS=${TON_SIMPLEX_MAX_TPS_FINALIZE_RESERVE_MS:-1000}
      - PROTO_VERSION
      - VALIDATORS_MASTERCHAIN_NUM
      - VALIDATORS_PER_SHARD
      - BLOCK_LIMIT_MULTIPLIER
      - BLOCK_SIZE_UNDERLOAD_KB
      - BLOCK_SIZE_SOFT_KB
      - BLOCK_SIZE_HARD_KB
      - BLOCK_GAS_LIMIT_UNDERLOAD
      - BLOCK_GAS_LIMIT_SOFT
      - BLOCK_GAS_LIMIT_HARD
      - SPAM_RUN
      - BASECHAIN_CONTRACT_FAUCETS
      - SPAM_CHAINS
      - SPAM_HOPS
      - SPAM_SPLIT_HOPS
      - SPAM_DURATION_MINUTES
      # Provision native load accounts in genesis, but never run load inside the
      # validator container.  The native-load-generator profile owns traffic.
      - NATIVE_SPAM_RUN=0
      - NATIVE_LOAD_SOURCES
      - TON_NATIVE_EXECUTOR_THREADS
      - TON_NATIVE_COLLATOR_QUEUE_LIMIT=${TON_NATIVE_COLLATOR_QUEUE_LIMIT:-32768}
      - TON_NATIVE_EXT_MSG_TRANSPORT_WINDOW=${TON_NATIVE_EXT_MSG_TRANSPORT_WINDOW:-1024}
      - TON_NATIVE_CHECKPOINT_RETAIN_INGRESS=${TON_NATIVE_CHECKPOINT_RETAIN_INGRESS:-0}
      - TON_NATIVE_POST_COMMIT_PACK_GRACE_20MS=${TON_NATIVE_POST_COMMIT_PACK_GRACE_20MS:-0}
      - TON_NATIVE_MEMPOOL_MAX_TTL=${TON_NATIVE_MEMPOOL_MAX_TTL:-3600}
      - NATIVE_SPAM_MODE
      - NATIVE_SPAM_SOURCES
      - NATIVE_SPAM_DURATION_SECONDS
      - NATIVE_SPAM_ROUNDS
      - NATIVE_SPAM_AMOUNT
      - NATIVE_SPAM_FEE
      - NATIVE_SPAM_TOPUP_AMOUNT
      - NATIVE_SPAM_TOPUP_MODE
      - NATIVE_SPAM_GENESIS_ACCOUNT_LIMIT
      - NATIVE_SPAM_GENESIS_SOURCE_LIMIT
      - NATIVE_SPAM_GENESIS_DESTINATIONS
      - NATIVE_SPAM_GENESIS_SOURCES
      - NATIVE_SPAM_GENESIS_TOPUP_AMOUNT
      - NATIVE_SPAM_GENESIS_SOURCE_BALANCE
      - NATIVE_SPAM_GENESIS_DEST_BALANCE
      - NATIVE_SPAM_GENESIS_PROGRESS_EVERY
      - NATIVE_SPAM_POST_GENESIS_TOPUPS
      - NATIVE_SPAM_PARALLELISM
      - NATIVE_SPAM_TRANSFER_TIMEOUT_SECONDS
      - NATIVE_SPAM_CONFIRM_TIMEOUT_SECONDS
      - NATIVE_SPAM_TOPUP_TIMEOUT_SECONDS
      - NATIVE_SPAM_FORCE_TOPUP
      - NATIVE_SPAM_WORK_DIR
      - NATIVE_SPAM_WALLET_DIR
      - NATIVE_SPAM_LOCK_TIMEOUT_SECONDS
      - NATIVE_SPAM_LITESERVER_ADDR
      - NATIVE_SPAM_LITE_TIMEOUT_SECONDS
      - NATIVE_SPAM_KEEP_ARTIFACTS
      - NATIVE_SPAM_TMP_DIR
      - NATIVE_SPAM_CONFIRM_PARALLELISM
      - NATIVE_SPAM_CONFIRM_POLL_SECONDS
      - NATIVE_SPAM_CONFIRM_MODE
      - NATIVE_SPAM_PROGRESS_INTERVAL_SECONDS
      - NATIVE_TPS_INTERVAL_SECONDS
      - NATIVE_TPS_WORKCHAIN
      - NATIVE_TPS_PRINT_LIMIT
      - NATIVE_TPS_LITE_TIMEOUT_SECONDS
      - NATIVE_TPS_LITESERVER_ADDR
      - NATIVE_TPS_VERBOSE_BLOCKS
      - NATIVE_TPS_BACKFILL_BLOCKS
      - NATIVE_TPS_MAX_BLOCKS_PER_INTERVAL
    healthcheck:
      test: /usr/local/bin/lite-client -a 127.0.0.1:40004 -p /var/ton-work/db/liteserver.pub -t 3 -c last
      interval: ${HEALTHCHECK_INTERVAL:-15s}
      timeout: 5s
      retries: ${GENESIS_HEALTHCHECK_RETRIES:-20}
      start_period: ${GENESIS_HEALTHCHECK_START_PERIOD:-60s}
    deploy:
      resources:
        limits:
          cpus: '${GENESIS_CPU_QUOTE:-1.0}'
    networks:
      main:
        ipv4_address: 172.28.1.10

  native-load-generator:
    container_name: native-load-generator
    profiles: [native-load-generator]
    image: mylocalton-native-load-generator:${TON_BRANCH:-latest}
    build:
      context: .
      dockerfile: ./native-load-generator/Dockerfile
      pull: ${TON_BUILD_PULL:-true}
      args:
        TON_IMAGE: ${TON_IMAGE:-ghcr.io/corton-nommander/ton}
        TON_BRANCH: ${TON_BRANCH:-latest}
    restart: "no"
    volumes:
      - shared-data:/usr/share/data:ro
      - native-load-wallets:/wallets:ro
    environment:
      - NATIVE_LOAD_GLOBAL_CONFIG=/usr/share/data/global.config.json
      - NATIVE_LOAD_WALLET_DIR=/wallets
      - NATIVE_LOAD_SOURCES
      - NATIVE_LOAD_CONNECTIONS
      - NATIVE_LOAD_SIGNERS
      - NATIVE_LOAD_INFLIGHT
      - NATIVE_LOAD_SUBMIT_BATCH_SIZE
      - NATIVE_LOAD_SUBMIT_SOURCE_RUN_SIZE
      # Future v5 source-signed NativeTransferRun mode. The entrypoint keeps
      # this off unless explicitly requested, so v14 workloads are unchanged.
      - NATIVE_LOAD_NATIVE_TRANSFER_RUNS=${NATIVE_LOAD_NATIVE_TRANSFER_RUNS:-0}
      - NATIVE_LOAD_NATIVE_TRANSFER_RUN_SIZE=${NATIVE_LOAD_NATIVE_TRANSFER_RUN_SIZE:-16}
      - NATIVE_LOAD_NATIVE_RUN_BATCHING=${NATIVE_LOAD_NATIVE_RUN_BATCHING:-0}
      # The lane profile validates its manifest and waits for the exact 2^depth
      # masterchain-anchored basechain leaves before generating traffic.
      - NATIVE_PAYMENT_LANES_ENABLED=${NATIVE_PAYMENT_LANES_ENABLED:-0}
      - NATIVE_PAYMENT_LANE_DEPTH=${NATIVE_PAYMENT_LANE_DEPTH:-1}
      - NATIVE_LOAD_PAYMENT_LANE_DEPTH=${NATIVE_LOAD_PAYMENT_LANE_DEPTH:-0}
      - NATIVE_LOAD_PAYMENT_LANE_READY_TIMEOUT_SECONDS=${NATIVE_LOAD_PAYMENT_LANE_READY_TIMEOUT_SECONDS:-360}
      - NATIVE_LOAD_PAYMENT_LANE_READY_POLL_SECONDS=${NATIVE_LOAD_PAYMENT_LANE_READY_POLL_SECONDS:-2}
      - NATIVE_LOAD_PAYMENT_LANE_READY_STABLE_OBSERVATIONS=${NATIVE_LOAD_PAYMENT_LANE_READY_STABLE_OBSERVATIONS:-2}
      - NATIVE_LOAD_PAYMENT_LANE_LITESERVER_TIMEOUT_SECONDS=${NATIVE_LOAD_PAYMENT_LANE_LITESERVER_TIMEOUT_SECONDS:-5}
      - NATIVE_LOAD_PAYMENT_LANE_MANIFEST
      - NATIVE_LOAD_SUBMIT_COALESCE_MS
      - NATIVE_LOAD_SUBMIT_MAX_QUERIES_PER_CLIENT
      - NATIVE_LOAD_MAX_CANONICAL_BACKLOG
      - NATIVE_LOAD_MAX_SOURCE_CANONICAL_BACKLOG
      - NATIVE_LOAD_DURATION_SECONDS
      - NATIVE_LOAD_AMOUNT
      - NATIVE_LOAD_FEE
      - NATIVE_LOAD_START_NONCE
      - NATIVE_LOAD_QUERY_TIMEOUT_SECONDS
      - NATIVE_LOAD_REPORT_INTERVAL_SECONDS
      - NATIVE_LOAD_TARGET_TPS
      - NATIVE_LOAD_RAMP_SECONDS
      - NATIVE_LOAD_WARMUP_SECONDS
      - NATIVE_LOAD_DRAIN_TIMEOUT_SECONDS
      - NATIVE_LOAD_VALID_FOR_SECONDS
      - NATIVE_LOAD_WORKERS
      - NATIVE_LOAD_MAX_RETRIES
      - NATIVE_LOAD_RETRY_BACKOFF_MS
      - NATIVE_LOAD_RETRY_HORIZON_SECONDS
      - NATIVE_LOAD_CANONICAL_STATE_LAG_RETRY_BACKOFF_MS
      - NATIVE_LOAD_CANONICAL_STATE_LAG_RETRY_MAX_BACKOFF_MS
      - NATIVE_LOAD_AUTO_NONCE
      - NATIVE_LOAD_ADAPTIVE_INFLIGHT
      - NATIVE_LOAD_ADAPTIVE_INITIAL_RTT_SECONDS
      - NATIVE_LOAD_ADAPTIVE_MAX_CWND
      - NATIVE_LOAD_SOURCE_OFFSET
      - NATIVE_LOAD_FINALITY_POLL_SECONDS
      - NATIVE_LOAD_FINALITY_SAMPLE_SOURCES
      - NATIVE_LOAD_CANONICAL_POLL_SECONDS
      - NATIVE_LOAD_CANONICAL_QUERY_TIMEOUT_SECONDS
      - NATIVE_LOAD_CANONICAL_RETRY_LIMIT
      - NATIVE_LOAD_CANONICAL_RETRY_BACKOFF_SECONDS
      - NATIVE_LOAD_CANONICAL_RETRY_MAX_BACKOFF_SECONDS
      - NATIVE_LOAD_REPAIR_COOLDOWN_SECONDS
      - NATIVE_LOAD_CANONICAL_BLOCK_FOLLOWER
    depends_on:
      genesis:
        condition: service_healthy
    cpuset: ${NATIVE_LOAD_CPUSET:-}
    deploy:
      resources:
        limits:
          cpus: '${NATIVE_LOAD_CPU_QUOTE:-4}'
          memory: '${NATIVE_LOAD_MEMORY_LIMIT:-2g}'
    networks:
      main:
        ipv4_address: 172.28.1.29

  # MyLocalTon optional services
  blockchain-explorer:
    container_name: blockchain-explorer
    profiles: [blockchain-explorer]
    image: ${MLT_EXPLORER_IMAGE:-ghcr.io/neodix42/mylocalton-docker-explorer}:${TON_BRANCH:-latest}
    build:
      context: .
      dockerfile: ./explorer/Dockerfile
      pull: ${TON_BUILD_PULL:-true}
      args:
        MLT_EXPLORER_IMAGE: ${MLT_EXPLORER_IMAGE:-ghcr.io/neodix42/mylocalton-docker-explorer}
        TON_IMAGE: ${TON_IMAGE:-ghcr.io/corton-nommander/ton}
        TON_BRANCH: ${TON_BRANCH:-latest}
    restart: unless-stopped
    environment:
      - SERVER_PORT=8080
      - FILE_SERVER_IP=172.28.1.24
      - FILE_SERVER_PORT=8000
    ports:
      - "${UI_BIND_IP:-0.0.0.0}:8080:8080"
    healthcheck:
      test: curl -sS http://127.0.0.1:8080/last || echo 1
      interval: 15s
      timeout: 10s
      retries: 3
    volumes:
      - shared-data:/usr/share/data
    depends_on:
      genesis:
        condition: service_healthy
    networks:
      main:
        ipv4_address: 172.28.1.20

  lite-server:
    container_name: lite-server
    profiles: [lite-server]
    image: ${MLT_LITE_SERVER_IMAGE:-ghcr.io/neodix42/mylocalton-docker-lite-server}:${TON_BRANCH:-latest}
    build:
      context: .
      dockerfile: ./lite-server/Dockerfile
      pull: ${TON_BUILD_PULL:-true}
      args:
        MLT_LITE_SERVER_IMAGE: ${MLT_LITE_SERVER_IMAGE:-ghcr.io/neodix42/mylocalton-docker-lite-server}
        TON_IMAGE: ${TON_IMAGE:-ghcr.io/corton-nommander/ton}
        TON_BRANCH: ${TON_BRANCH:-latest}
    restart: unless-stopped
    environment:
      - LITE_SERVER_PORT=30004
      - CONSOLE_PORT=30002
      - PUBLIC_PORT=30001
    ports:
      - "${LITESERVER_BIND_IP:-0.0.0.0}:30004:30004"
    healthcheck:
      test: /usr/local/bin/lite-client -a 127.0.0.1:30004 -p /var/ton-work/db/liteserver.pub -t 3 -c last
      interval: 15s
      timeout: 10s
      retries: 3
    volumes:
      - shared-data:/usr/share/data
    depends_on:
      genesis:
        condition: service_healthy
    networks:
      main:
        ipv4_address: 172.28.1.30

  faucet:
    container_name: faucet
    profiles: [faucet]
    image: ${MLT_FAUCET_IMAGE:-ghcr.io/neodix42/mylocalton-docker-faucet}:${TON_BRANCH:-latest}
    build:
      context: .
      dockerfile: ./faucet/Dockerfile
      pull: ${TON_BUILD_PULL:-true}
      args:
        MLT_FAUCET_IMAGE: ${MLT_FAUCET_IMAGE:-ghcr.io/neodix42/mylocalton-docker-faucet}
        TON_IMAGE: ${TON_IMAGE:-ghcr.io/corton-nommander/ton}
        TON_BRANCH: ${TON_BRANCH:-latest}
    ports:
      - "${UI_BIND_IP:-0.0.0.0}:88:88"
    volumes:
      - shared-data:/usr/share/data
    restart: unless-stopped
    depends_on:
      genesis:
        condition: service_healthy
    environment:
      - SERVER_PORT=88
      - FAUCET_USE_RECAPTCHA # default true
      - RECAPTCHA_SITE_KEY # google reCaptcha v2
      - RECAPTCHA_SECRET   # google reCaptcha v2
      - MASTERCHAIN_ONLY=${FAUCET_MASTERCHAIN_ONLY:-false}   # default false, if true generates new addresses only in masterchain (-1)
      - FAUCET_REQUEST_EXPIRATION_PERIOD #  default 86400 seconds (24h)
      - FAUCET_SINGLE_GIVEAWAY    # default 10 grams
    healthcheck:
      test: curl -sS http://127.0.0.1:88|| echo 1
    networks:
      main:
        ipv4_address: 172.28.1.21

  data:
    container_name: data-generator
    profiles: [data]
    image: ${MLT_DATA_IMAGE:-ghcr.io/neodix42/mylocalton-docker-data}:${TON_BRANCH:-latest}
    build:
      context: .
      dockerfile: ./data/Dockerfile
      pull: ${TON_BUILD_PULL:-true}
      args:
        MLT_DATA_IMAGE: ${MLT_DATA_IMAGE:-ghcr.io/neodix42/mylocalton-docker-data}
        TON_IMAGE: ${TON_IMAGE:-ghcr.io/corton-nommander/ton}
        TON_BRANCH: ${TON_BRANCH:-latest}
    ports:
      - "${UI_BIND_IP:-0.0.0.0}:99:99"
    volumes:
      - shared-data:/usr/share/data
    restart: unless-stopped
    depends_on:
      genesis:
        condition: service_healthy
    environment:
      - SERVER_PORT=99
      - PERIOD=5
    healthcheck:
      test: curl -sS http://127.0.0.1:99|| echo 1
    networks:
      main:
        ipv4_address: 172.28.1.22

  config-update:
    container_name: config-update
    profiles: [config-update]
    image: ${MLT_CONFIG_UPDATE_IMAGE:-ghcr.io/neodix42/mylocalton-docker-config-update}:${TON_BRANCH:-latest}
    build:
      context: .
      dockerfile: ./config-update/Dockerfile
      pull: ${TON_BUILD_PULL:-true}
      args:
        MLT_CONFIG_UPDATE_IMAGE: ${MLT_CONFIG_UPDATE_IMAGE:-ghcr.io/neodix42/mylocalton-docker-config-update}
        TON_IMAGE: ${TON_IMAGE:-ghcr.io/corton-nommander/ton}
        TON_BRANCH: ${TON_BRANCH:-latest}
    ports:
      - "${UI_BIND_IP:-0.0.0.0}:8084:8084"
    volumes:
      - shared-data:/usr/share/data
    restart: unless-stopped
    depends_on:
      genesis:
        condition: service_healthy
    environment:
      - SERVER_PORT=8084
      - GLOBAL_CONFIG_PATH
      - CONFIG_KEY_PATH
    healthcheck:
      test: curl -sS http://127.0.0.1:8084 || echo 1
    networks:
      main:
        ipv4_address: 172.28.1.26

  admin-portal:
    container_name: admin-portal
    profiles: [admin-portal]
    image: ${MLT_ADMIN_PORTAL_IMAGE:-ghcr.io/neodix42/mylocalton-docker-admin-portal}:${TON_BRANCH:-latest}
    build:
      context: .
      dockerfile: ./admin-portal/Dockerfile
      pull: ${TON_BUILD_PULL:-true}
      args:
        MLT_ADMIN_PORTAL_IMAGE: ${MLT_ADMIN_PORTAL_IMAGE:-ghcr.io/neodix42/mylocalton-docker-admin-portal}
        TON_IMAGE: ${TON_IMAGE:-ghcr.io/corton-nommander/ton}
        TON_BRANCH: ${TON_BRANCH:-latest}
    ports:
      - "${UI_BIND_IP:-0.0.0.0}:8085:8085"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace
    restart: unless-stopped
    environment:
      - SERVER_PORT=8085
      - COMPOSE_PROJECT_DIR=/workspace
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-mylocaltondocker}
      - COMPOSE_PROFILES=${COMPOSE_PROFILES:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: curl -sS http://127.0.0.1:8085 || echo 1
    networks:
      main:
        ipv4_address: 172.28.1.27

  time-machine:
    container_name: time-machine
    profiles: [time-machine]
    image: ${MLT_TIME_MACHINE_IMAGE:-ghcr.io/neodix42/mylocalton-docker-time-machine}:${TON_BRANCH:-latest}
    build:
      context: .
      dockerfile: ./time-machine/Dockerfile
      pull: ${TON_BUILD_PULL:-true}
      args:
        MLT_TIME_MACHINE_IMAGE: ${MLT_TIME_MACHINE_IMAGE:-ghcr.io/neodix42/mylocalton-docker-time-machine}
        TON_IMAGE: ${TON_IMAGE:-ghcr.io/corton-nommander/ton}
        TON_BRANCH: ${TON_BRANCH:-latest}
    ports:
      - "${UI_BIND_IP:-0.0.0.0}:8083:8083"
    volumes:
      - shared-data:/usr/share/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    depends_on:
      genesis:
        condition: service_healthy
    environment:
      - SERVER_PORT=8083
    healthcheck:
      test: curl -sS http://127.0.0.1:8083 || echo 1
    networks:
      main:
        ipv4_address: 172.28.1.23

  session-stats:
    container_name: session-stats
    profiles: [session-stats]
    image: ${SESSION_STATS_IMAGE:-ghcr.io/neodix42/ton-session-stats:latest}
    ports:
      - "${SESSION_STATS_BIND_IP:-0.0.0.0}:${SESSION_STATS_HTTP_PORT:-18000}:18000"
    volumes:
      - ${HOST_FS_ROOT:-/}:/hostfs:ro
      - ${DOCKER_VOLUMES_HOST_DIR:-/var/lib/docker/volumes}:/docker-volumes:ro
      - session-stats-data:/data
    restart: unless-stopped
    cpuset: ${SESSION_STATS_CPUSET:-}
    depends_on:
      genesis:
        condition: service_healthy
    environment:
      PORT: 18000
      GUNICORN_WORKERS: ${SESSION_STATS_GUNICORN_WORKERS:-4}
      SESSION_STATS_TITLE: ${SESSION_STATS_TITLE:-TON session stats}
      SESSION_STATS_DB_FILE: /data/session-stats.sqlite
      SESSION_STATS_FRONTEND_BUILD_DIR: /app/frontend/build
      HOST_FS_ROOT: ${HOST_FS_ROOT:-/}
      DOCKER_VOLUMES_ROOT: /docker-volumes
      TON_WORK_HOST_DIR: ${TON_WORK_HOST_DIR:-}
      TON_WORK_DOCKER_VOLUME: ${TON_WORK_DOCKER_VOLUME:-}
      SESSION_STATS_DIR_HOST_DIR: ${SESSION_STATS_DIR_HOST_DIR:-}
      SESSION_STATS_ARCHIVE_DIR: ${SESSION_STATS_ARCHIVE_DIR:-}
      SESSION_STATS_FILENAME: ${SESSION_STATS_FILENAME:-log.session-stats}
      SESSION_STATS_SELF: ${SESSION_STATS_SELF:-local-validator}
      SESSION_STATS_IMPORT_INTERVAL_SECONDS: ${SESSION_STATS_IMPORT_INTERVAL_SECONDS:-60}
      SESSION_STATS_IMPORT_LAG_SECONDS: ${SESSION_STATS_IMPORT_LAG_SECONDS:-15}
      SESSION_STATS_IMPORT_LOOKBACK_SECONDS: ${SESSION_STATS_IMPORT_LOOKBACK_SECONDS:-1800}
      SESSION_STATS_PRIVATE_NET: ${SESSION_STATS_PRIVATE_NET:-false}
      SESSION_STATS_NATIVE_FAST_PATH: ${SESSION_STATS_NATIVE_FAST_PATH:-false}
      SESSION_STATS_NATIVE_WORKCHAIN: ${SESSION_STATS_NATIVE_WORKCHAIN:-0}
      SESSION_STATS_ALLOW_UNCORRELATED_CANDIDATES: ${SESSION_STATS_ALLOW_UNCORRELATED_CANDIDATES:-false}
      SESSION_STATS_VALIDATE_ACTUAL_WORK_TIME: ${SESSION_STATS_VALIDATE_ACTUAL_WORK_TIME:-true}
      SESSION_STATS_WORK_TIME_STATS_BY_SOURCE: ${SESSION_STATS_WORK_TIME_STATS_BY_SOURCE:-true}
      SESSION_STATS_WORK_TIME_STATS_BY_SOURCE_LIST: ${SESSION_STATS_WORK_TIME_STATS_BY_SOURCE_LIST:-}
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18000/api/chart-config', timeout=3).read()" || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '${SESSION_STATS_CPU_QUOTE:-1}'
    networks:
      main:
        ipv4_address: 172.28.1.28

  file-server:
    container_name: file-server
    image: python:bullseye
    ports:
      - "${FILE_SERVER_BIND_IP:-0.0.0.0}:8000:8000"
    volumes:
      - shared-data:/usr/share/data
    entrypoint:
      python3 -m http.server 8000 -d /usr/share/data
    restart: unless-stopped
    environment:
      - SERVER_PORT=8000
    healthcheck:
      test: curl -sS http://127.0.0.1:8000|| echo 1
    networks:
      main:
        ipv4_address: 172.28.1.24

  restarter:
    container_name: explorer-restarter
    profiles: [blockchain-explorer]
    image: docker:cli
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: [ "/bin/sh", "-c", "while true; do sleep 3600; echo restarted; docker restart blockchain-explorer; done" ]
    depends_on:
      blockchain-explorer:
        condition: service_healthy
    networks:
      main:
        ipv4_address: 172.28.1.25


